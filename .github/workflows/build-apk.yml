name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Sora Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android APKs (Release & Debug)
        working-directory: android
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload APK Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sora-Android-APKs
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release (Direct APK Download)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.0-apk"
          name: "Sora v1.0.0 — Android APK Release"
          body: |
            ### 📱 Sora — Android APK
            **Unfiltered stories, living characters, zero ads. Just pure immersion.**

            #### 📥 Direct Downloads:
            - **`app-release.apk`**: R8-minified, resource-shrunk, single-DEX optimized build (Recommended).
            - **`app-debug.apk`**: Standard debug build.
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
