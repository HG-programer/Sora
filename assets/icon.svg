<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep obsidian velvet radial canvas -->
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#241b2e"/>
      <stop offset="55%" stop-color="#140f1c"/>
      <stop offset="100%" stop-color="#0a080e"/>
    </radialGradient>

    <!-- Luxury perimeter bevel -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#fb7185" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Upper Flowing Ribbon: Sunset Coral to Golden Peach -->
    <linearGradient id="upperWing" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Lower Flowing Ribbon: Nectar Rose to Amber Bronze -->
    <linearGradient id="lowerWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="60%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Radiant Story Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- 1. Base App Squircle Canvas (iOS & Android Standard Mask) -->
  <rect width="512" height="512" rx="118" fill="url(#bgGlow)"/>

  <!-- 2. Precision Chamfered Bevel Rim -->
  <rect x="12" y="12" width="488" height="488" rx="106" fill="none" stroke="url(#bevelGrad)" stroke-width="2.5"/>

  <!-- 3. Ambient Crown Aura -->
  <circle cx="256" cy="245" r="140" fill="#f97316" opacity="0.08" filter="blur(30px)"/>

  <!-- 4. Sculpted Sora Emblem ('S' Harmony of Twin Dialogue Wings & Story Spark) -->
  <g filter="url(#shadow)">
    <!-- Upper Flowing Ribbon: Sweeping character silhouette / dialogue horizon -->
    <path d="M 370 126
             C 275 110, 150 148, 142 228
             C 136 288, 198 304, 256 312
             C 214 300, 182 284, 184 246
             C 188 194, 280 162, 360 178
             C 382 182, 396 172, 392 152
             C 388 136, 380 128, 370 126 Z"
          fill="url(#upperWing)"/>

    <!-- Specular highlight on upper crown curve -->
    <path d="M 348 138 C 280 126, 178 156, 160 216"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.45"/>

    <!-- Lower Flowing Ribbon: Counter-flowing companion response -->
    <path d="M 142 386
             C 237 402, 362 364, 370 284
             C 376 224, 314 208, 256 200
             C 298 212, 330 228, 328 266
             C 324 318, 232 350, 152 334
             C 130 330, 116 340, 120 360
             C 124 376, 132 384, 142 386 Z"
          fill="url(#lowerWing)"/>

    <!-- Specular highlight on lower base curve -->
    <path d="M 164 374 C 232 386, 334 356, 352 296"
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

    <!-- Central Floating Diamond Story Spark ✦ (The Soul of Sora) -->
    <!-- Core Spark Glow Halo -->
    <circle cx="256" cy="256" r="32" fill="url(#sparkGlow)" opacity="0.55"/>

    <!-- 4-Pointed Star Glyph -->
    <path d="M 256 208
             Q 256 256 208 256
             Q 256 256 256 304
             Q 256 256 304 256
             Q 256 256 256 208 Z"
          fill="#ffffff"/>

    <path d="M 256 218
             Q 256 256 218 256
             Q 256 256 256 294
             Q 256 256 294 256
             Q 256 256 256 218 Z"
          fill="#fef08a"/>

    <!-- Tiny orbiting story sparks -->
    <circle cx="360" cy="230" r="3" fill="#fef08a" opacity="0.75"/>
    <circle cx="152" cy="282" r="2.5" fill="#fcd34d" opacity="0.6"/>
    <path d="M 378 110 Q 378 118 370 118 Q 378 118 378 126 Q 378 118 386 118 Q 378 118 378 110 Z" fill="#fcd34d" opacity="0.8"/>
  </g>
</svg>